[project]
name = "oatm"
version = "0.1.0"
description = "Occlusion-Adaptive Temporal Memory -- active research workspace"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6,<7",
    "pandas>=2.2,<3",
    "pyarrow>=16,<26",
    "pyquaternion>=0.9.9,<0.10",
    "shapely>=2,<3",
    "scipy>=1.12,<2",
    "pillow>=10,<13",
    "ultralytics>=8.3,<9",
    "matplotlib>=3.8,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
