[project]
name = "oatm"
version = "0.1.0"
description = "Occlusion-Adaptive Temporal Memory -- active research workspace"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
